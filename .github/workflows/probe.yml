name: Probe
on:
  push:
    branches: [mac-app]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: qwen3 4b
        run: curl -s "https://huggingface.co/api/models/mlx-community/Qwen3-4B-Instruct-2507-4bit/tree/main" | jq -r '.[]? | select(.size>100000) | "Q3-4B \(.path) \(.size)"' | head -9 | sed 's/^/::notice::/'
      - name: litert list
        run: curl -s "https://huggingface.co/api/models?author=litert-community&search=Qwen&limit=30" | jq -r '.[] | "\(.id) gated=\(.gated)"' | head -10 | sed 's/^/::notice::/'
      - name: litert qwen 1.5
        run: curl -s "https://huggingface.co/api/models/litert-community/Qwen2.5-1.5B-Instruct/tree/main" | jq -r '.[]? | "L15 \(.path) \(.size)"' | head -10 | sed 's/^/::notice::/'
      - name: litert qwen3
        run: |
          for r in litert-community/Qwen3-0.6B litert-community/Qwen2.5-3B-Instruct; do curl -s "https://huggingface.co/api/models/$r/tree/main" | jq -r --arg r "$r" '.[]? | select(.size>1000000) | "\($r) \(.path) \(.size)"'; done | head -10 | sed 's/^/::notice::/'
      - name: versions
        run: |
          { curl -s "https://repo1.maven.org/maven2/com/google/mediapipe/tasks-genai/maven-metadata.xml" | grep -o "<version>[^<]*" | tail -3 | sed 's/<version>/genai /'
            curl -s "https://api.github.com/repos/ml-explore/mlx-swift-examples/tags?per_page=3" | jq -r '.[].name' | sed 's/^/mlx-examples /'
            curl -s "https://api.github.com/repos/ml-explore/mlx-swift-lm/tags?per_page=3" | jq -r '.[]?.name' | sed 's/^/mlx-lm /'; } | head -10 | sed 's/^/::notice::/'
