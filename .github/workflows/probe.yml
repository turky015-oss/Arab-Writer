name: Probe
on:
  push:
    branches: [mac-app]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          note() { while IFS= read -r l; do echo "::notice::$l"; done; }
          for r in mlx-community/Qwen2.5-3B-Instruct-4bit mlx-community/Qwen3-4B-Instruct-2507-4bit mlx-community/Qwen3-1.7B-4bit; do
            curl -s "https://huggingface.co/api/models/$r" | jq -r --arg r "$r" '"\($r) gated=\(.gated) private=\(.private)"' | note
            curl -s "https://huggingface.co/api/models/$r/tree/main" | jq -r --arg r "$r" '.[] | "\($r) \(.path) \(.size)"' | note
          done
          curl -s "https://huggingface.co/api/models?author=litert-community&search=Qwen&limit=30" | jq -r '.[] | "LITERT \(.id) gated=\(.gated)"' | note
          for r in litert-community/Qwen2.5-1.5B-Instruct litert-community/Qwen3-0.6B litert-community/Qwen2.5-3B-Instruct; do
            curl -s "https://huggingface.co/api/models/$r/tree/main" | jq -r --arg r "$r" '.[]? | "\($r) \(.path) \(.size)"' | note
          done
          curl -s "https://repo1.maven.org/maven2/com/google/mediapipe/tasks-genai/maven-metadata.xml" | grep -o "<version>[^<]*" | tail -5 | note
          curl -s "https://api.github.com/repos/ml-explore/mlx-swift-examples/tags?per_page=5" | jq -r '.[].name' | sed 's/^/mlx-swift-examples /' | note
          curl -s "https://api.github.com/repos/ml-explore/mlx-swift-lm/tags?per_page=5" | jq -r '.[]?.name' | sed 's/^/mlx-swift-lm /' | note
