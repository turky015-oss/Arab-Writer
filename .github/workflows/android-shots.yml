name: Android screenshots

on:
  workflow_dispatch:
  push:
    branches: [mac-app]
    paths: ["scripts/android_shots.py", ".github/workflows/android-shots.yml"]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace -q
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            python3 scripts/android_shots.py shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: shots/*.png
      - name: Publish to branch
        if: always()
        run: |
          cd shots && git init -q && git checkout -q -b android-shots
          git add *.png && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "screenshots"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-shots
