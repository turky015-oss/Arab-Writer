name: Build

on:
  push:
    branches: [main, mac-app]
    paths-ignore: ["android/**", ".github/workflows/android.yml", "README.md", "docs/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Tests
        run: |
          set +e
          swift test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E "error:|failed|Fatal|XCTAssert|Crash|signal" test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: Model
          key: mlx-qwen2.5-3b-instruct-4bit-v1

      - name: Fetch model
        run: scripts/fetch_model.sh

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.2.${GITHUB_RUN_NUMBER}"
          scripts/build_app.sh "$VERSION"
          ls -la dist

      - name: Test release
        if: github.ref == 'refs/heads/mac-app'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-mac
          name: "نسخة تجربة · ماك"
          prerelease: true
          make_latest: false
          body: "نسخة تجربة للماك (معالجات أبل) مع النموذج الداخلي. ليست إصداراً نهائياً."
          files: dist/*.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
