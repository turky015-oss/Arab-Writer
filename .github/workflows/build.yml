name: Build

on:
  push:
    branches: [main, mac-app]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Tests
        run: swift test

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.${GITHUB_RUN_NUMBER}"
          chmod +x scripts/build_app.sh
          scripts/build_app.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Arab-Writer-mac
          path: |
            dist/*.zip
            dist/*.dmg

      - name: Test build branch
        if: github.ref == 'refs/heads/mac-app'
        run: |
          mkdir -p /tmp/out && cp dist/*.dmg /tmp/out/Arab-Writer.dmg
          cd /tmp/out
          git init -q -b mac-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Arab-Writer.dmg
          git commit -qm "test build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" mac-build

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
          generate_release_notes: true
