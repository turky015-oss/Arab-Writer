name: Android

on:
  push:
    branches: [main, mac-app]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key
        env:
          KEY_B64: ${{ secrets.AW_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.AW_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "AW_KEYSTORE_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "AW_KEYSTORE=$PWD/signing/test.jks" >> "$GITHUB_ENV"
            echo "AW_KEYSTORE_PASSWORD=arabwriter-test" >> "$GITHUB_ENV"
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.1.${GITHUB_RUN_NUMBER}"
          echo "AW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "AW_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Tests
        run: gradle :app:testReleaseUnitTest --stacktrace

      - name: Build APK
        run: |
          set +e
          gradle :app:assembleRelease --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            { grep -E "^e: |error:" build.log | sort -u | head -15; grep -A6 "What went wrong" build.log | head -14; } | grep -v '^\s*$' | while IFS= read -r l; do echo "::error::$l"; done
            df -h . | tail -1 | sed 's/^/::error::disk /'
            tail -40 build.log; exit $code
          fi
          set -e
          mkdir -p ../dist-android
          cp app/build/outputs/apk/release/app-release.apk "../dist-android/Arab-Writer-$AW_VERSION.apk"

      - name: Test release
        if: github.ref == 'refs/heads/mac-app'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-android
          name: "نسخة تجربة · أندرويد"
          prerelease: true
          make_latest: false
          body: "نسخة تجربة للأندرويد. النموذج الداخلي ينزل من داخل التطبيق أول مرة. ليست إصداراً نهائياً."
          files: dist-android/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-android/*.apk
