name: Android

on:
  push:
    branches: [main, mac-app]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key
        env:
          KEY_B64: ${{ secrets.AW_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.AW_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "AW_KEYSTORE_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "AW_KEYSTORE=$PWD/signing/test.jks" >> "$GITHUB_ENV"
            echo "AW_KEYSTORE_PASSWORD=arabwriter-test" >> "$GITHUB_ENV"
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.1.${GITHUB_RUN_NUMBER}"
          echo "AW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "AW_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Tests
        run: gradle :app:testReleaseUnitTest --stacktrace

      - name: Build APK
        run: |
          gradle :app:assembleRelease --stacktrace
          mkdir -p ../dist-android
          cp app/build/outputs/apk/release/app-release.apk "../dist-android/Arab-Writer-$AW_VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Arab-Writer-android
          path: dist-android/*.apk

      - name: Test build branch
        if: github.ref == 'refs/heads/mac-app'
        working-directory: dist-android
        run: |
          cp *.apk /tmp/Arab-Writer.apk
          mkdir -p /tmp/out && cd /tmp/out && mv /tmp/Arab-Writer.apk .
          git init -q -b android-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Arab-Writer.apk
          git commit -qm "android test build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-build

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-android/*.apk
